name: Account image

# Publishes the account service as a container image, so a host can pull a pinned
# build instead of compiling the tree. The image has no application secrets and no
# data: the volume and the environment of the instance supply both.
#
#   ghcr.io/lennartschoch/openbot-account:latest
#   ghcr.io/lennartschoch/openbot-account:sha-<commit>
#   ghcr.io/lennartschoch/openbot-account:account-vX.Y.Z   (tag push)

on:
  push:
    branches: [main]
    paths:
      - "account/**"
      - ".github/workflows/account-image.yml"
    tags:
      - "account-v*"
      - "fork-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: account-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openbot-account
        run: |
          docker build \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            account

      - name: Log in to the container registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openbot-account
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          # A fork release tag names the image version too, so a deployment can pin a version
          # instead of a commit sha, and Renovate can order the tags.
          for prefix in account-v fork-v; do
            if [[ "${GITHUB_REF}" == "refs/tags/${prefix}"* ]]; then
              version="${GITHUB_REF_NAME#"${prefix}"}"
              docker tag "$IMAGE:latest" "$IMAGE:${version}"
              docker push "$IMAGE:${version}"
            fi
          done
          echo "Pushed $IMAGE:sha-${GITHUB_SHA::12}" >>"$GITHUB_STEP_SUMMARY"

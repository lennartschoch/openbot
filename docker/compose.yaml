# OpenBot as a self-hosted server in Docker. See docs/docker.md.
#
#   curl -fsSLO https://raw.githubusercontent.com/lennartschoch/openbot/main/docker/compose.yaml
#   curl -fsSLO https://raw.githubusercontent.com/lennartschoch/openbot/main/docker/seccomp.json
#   docker compose up -d
#   docker compose exec openbot openbot login
services:
  openbot:
    # Use a version tag to choose when to upgrade. OpenBot never goes back to an older version.
    image: ghcr.io/lennartschoch/openbot:latest
    restart: unless-stopped
    security_opt:
      - seccomp=./seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    volumes:
      - openbot-data:/data

volumes:
  openbot-data:
